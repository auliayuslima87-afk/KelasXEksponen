<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika Agribisnis - Pangkat & Akar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(22, 163, 74, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.1);
            border-color: #4ade80;
        }
        .option-btn.selected {
            background-color: #16a34a;
            color: white;
            border-color: #15803d;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .math {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.15em;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        /* Custom Scrollbar for Leaderboard */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #86efac; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #22c55e; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex items-center justify-center p-4 sm:p-6">

    <!-- Container Utama -->
    <div id="app-container" class="glass-panel w-full max-w-3xl rounded-2xl overflow-hidden animate-fade-in hidden flex flex-col">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-green-700 to-green-600 text-white p-5 sm:p-6 text-center border-b-4 border-green-500 shadow-md">
            <h1 class="text-2xl sm:text-3xl font-bold mb-1 flex items-center justify-center gap-2 tracking-wide">
                <span>🌱</span> Matematika Agribisnis <span>🌾</span>
            </h1>
            <p class="text-green-100 text-sm sm:text-base font-medium">Bentuk Pangkat & Akar - Kelas X SMK</p>
        </header>

        <!-- Area Konten Dinamis -->
        <main class="p-5 sm:p-8 flex-grow" id="main-content">
            <!-- Konten akan diisi oleh JavaScript -->
        </main>

        <!-- Toast Notification -->
        <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 hidden z-50 transition-opacity duration-300">
            <div id="toast-message" class="bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl font-medium text-sm flex items-center gap-2">
                <span>ℹ️</span> <span id="toast-text">Pesan</span>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="global-loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-green-600 mb-4"></div>
        <p class="text-green-800 font-bold text-lg animate-pulse">Menyiapkan Sistem...</p>
    </div>

    <!-- Modul Firebase & Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi & Variabel Global
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sim-matematika-agri-v2';
        let db, auth, currentUser;
        let isOfflineMode = false; // Fallback jika Firebase gagal
        
        // State Aplikasi
        const state = {
            studentName: '',
            studentClass: '',
            currentQuestionIndex: 0,
            score: 0,
            answers: new Array(25).fill(null),
            timeLeft: 50 * 60 // 50 menit
        };

        let timerInterval = null;

        // Bank Soal (20 Matematika Dasar + 5 Cerita Agribisnis)
        const fullQuestions = [
            // Dasar
            { q: "Nilai dari <span class='math'>2<sup>5</sup></span> adalah...", o: ["10", "16", "32", "64", "128"], a: 2 },
            { q: "Bentuk sederhana dari <span class='math'>3<sup>2</sup> &times; 3<sup>4</sup></span> adalah...", o: ["<span class='math'>3<sup>6</sup></span>", "<span class='math'>3<sup>8</sup></span>", "<span class='math'>9<sup>6</sup></span>", "<span class='math'>9<sup>8</sup></span>", "<span class='math'>6<sup>6</sup></span>"], a: 0 },
            { q: "Bentuk sederhana dari <span class='math'>a<sup>7</sup> / a<sup>3</sup></span> adalah...", o: ["<span class='math'>a<sup>10</sup></span>", "<span class='math'>a<sup>4</sup></span>", "<span class='math'>a<sup>3</sup></span>", "<span class='math'>a<sup>21</sup></span>", "<span class='math'>a<sup>-4</sup></span>"], a: 1 },
            { q: "Hasil dari <span class='math'>(2<sup>3</sup>)<sup>2</sup></span> adalah...", o: ["<span class='math'>2<sup>5</sup></span>", "<span class='math'>2<sup>6</sup></span>", "<span class='math'>2<sup>9</sup></span>", "<span class='math'>4<sup>5</sup></span>", "<span class='math'>8<sup>3</sup></span>"], a: 1 },
            { q: "Nilai dari <span class='math'>5<sup>0</sup></span> adalah...", o: ["0", "1", "5", "-1", "Tak terdefinisi"], a: 1 },
            { q: "Hasil dari <span class='math'>2<sup>-3</sup></span> adalah...", o: ["-6", "-8", "1/6", "1/8", "8"], a: 3 },
            { q: "Bentuk akar dari <span class='math'>x<sup>1/2</sup></span> adalah...", o: ["<span class='math'>x<sup>2</sup></span>", "<span class='math'>2x</span>", "<span class='math'>&radic;x</span>", "<span class='math'><sup>3</sup>&radic;x</span>", "<span class='math'>x<sup>-2</sup></span>"], a: 2 },
            { q: "Hasil dari <span class='math'>&radic;144</span> adalah...", o: ["10", "12", "14", "16", "18"], a: 1 },
            { q: "Bentuk sederhana dari <span class='math'>&radic;50</span> adalah...", o: ["<span class='math'>5&radic;2</span>", "<span class='math'>2&radic;5</span>", "<span class='math'>25&radic;2</span>", "<span class='math'>5&radic;10</span>", "<span class='math'>10&radic;5</span>"], a: 0 },
            { q: "Hasil dari <span class='math'>3&radic;2 + 5&radic;2</span> adalah...", o: ["<span class='math'>8&radic;4</span>", "<span class='math'>15&radic;2</span>", "<span class='math'>8&radic;2</span>", "<span class='math'>15&radic;4</span>", "8"], a: 2 },
            { q: "Hasil dari <span class='math'>&radic;12 &times; &radic;3</span> adalah...", o: ["<span class='math'>&radic;15</span>", "<span class='math'>&radic;36</span>", "6", "9", "12"], a: 2 },
            { q: "Bentuk rasional dari <span class='math'>2 / &radic;3</span> adalah...", o: ["<span class='math'>(2&radic;3) / 3</span>", "<span class='math'>2&radic;3</span>", "<span class='math'>&radic;3 / 2</span>", "<span class='math'>(3&radic;3) / 2</span>", "<span class='math'>&radic;3</span>"], a: 0 },
            { q: "Nilai <span class='math'>x</span> yang memenuhi persamaan <span class='math'>2<sup>x</sup> = 16</span> adalah...", o: ["2", "3", "4", "5", "6"], a: 2 },
            { q: "Bentuk rasional dari <span class='math'>5 / (2 + &radic;3)</span> adalah...", o: ["<span class='math'>5(2 - &radic;3)</span>", "<span class='math'>10 - &radic;3</span>", "<span class='math'>5(2 + &radic;3)</span>", "<span class='math'>5</span>", "<span class='math'>-5(2 - &radic;3)</span>"], a: 0 },
            { q: "Hasil dari <span class='math'>(3a<sup>2</sup>)<sup>3</sup></span> adalah...", o: ["<span class='math'>3a<sup>6</sup></span>", "<span class='math'>9a<sup>6</sup></span>", "<span class='math'>27a<sup>5</sup></span>", "<span class='math'>27a<sup>6</sup></span>", "<span class='math'>9a<sup>5</sup></span>"], a: 3 },
            { q: "Jika <span class='math'>a = 4</span> dan <span class='math'>b = 9</span>, maka nilai dari <span class='math'>a<sup>1/2</sup> + b<sup>1/2</sup></span> adalah...", o: ["5", "7", "13", "36", "97"], a: 0 },
            { q: "Bentuk sederhana dari <span class='math'>&radic;72 / &radic;2</span> adalah...", o: ["4", "5", "6", "7", "8"], a: 2 },
            { q: "Hasil dari <span class='math'>2<sup>3</sup> &times; 2<sup>-1</sup></span> adalah...", o: ["1", "2", "4", "8", "16"], a: 2 },
            { q: "Hasil dari <span class='math'>(x<sup>2</sup>y<sup>3</sup>)<sup>4</sup></span> adalah...", o: ["<span class='math'>x<sup>6</sup>y<sup>7</sup></span>", "<span class='math'>x<sup>8</sup>y<sup>12</sup></span>", "<span class='math'>x<sup>8</sup>y<sup>7</sup></span>", "<span class='math'>x<sup>2</sup>y<sup>12</sup></span>", "<span class='math'>xy<sup>24</sup></span>"], a: 1 },
            { q: "Hasil perkalian <span class='math'>(2&radic;5)(3&radic;2)</span> adalah...", o: ["<span class='math'>5&radic;7</span>", "<span class='math'>6&radic;7</span>", "<span class='math'>5&radic;10</span>", "<span class='math'>6&radic;10</span>", "30"], a: 3 },
            // Soal Cerita Agribisnis
            { q: "Sebuah lahan perkebunan kelapa sawit berbentuk persegi memiliki luas <span class='math'>10<sup>4</sup></span> m<sup>2</sup>. Jika di sekeliling lahan akan dipasang pagar, berapa meter panjang kawat yang dibutuhkan untuk satu putaran pagar?", o: ["100 m", "200 m", "400 m", "800 m", "1000 m"], a: 2 },
            { q: "Pertumbuhan populasi hama wereng pada lahan padi mengikuti rumus <span class='math'>N = 50 &times; 2<sup>t/2</sup></span>, dengan t dalam hari. Berapa jumlah populasi hama setelah 6 hari?", o: ["100", "200", "300", "400", "500"], a: 3 },
            { q: "Volume tangki penyemprot pupuk cair (sprayer) berbentuk kubus adalah <span class='math'>27 &times; 10<sup>3</sup></span> cm<sup>3</sup>. Panjang sisi tangki tersebut adalah...", o: ["3 cm", "9 cm", "30 cm", "90 cm", "300 cm"], a: 2 },
            { q: "Sebuah bibit pohon mangga harum manis mengalami pertambahan tinggi sebesar <span class='math'>&radic;3</span> cm setiap minggu. Jika diamati selama <span class='math'>&radic;12</span> minggu, pertambahan tinggi total bibit tersebut adalah...", o: ["3 cm", "4 cm", "6 cm", "9 cm", "12 cm"], a: 2 },
            { q: "Hasil panen padi (dalam kuintal) pada lahan miring dirumuskan dengan <span class='math'>P(t) = 10 &times; &radic;t</span>, di mana t adalah waktu tanam dalam bulan. Jika panen ideal dicapai setelah 16 bulan pengamatan, hasil panennya adalah...", o: ["20 kuintal", "30 kuintal", "40 kuintal", "160 kuintal", "256 kuintal"], a: 2 }
        ];
        const optionLabels = ['A', 'B', 'C', 'D', 'E'];

        // UI Elements
        const mainContent = document.getElementById('main-content');
        const loadingScreen = document.getElementById('global-loading');
        const appContainer = document.getElementById('app-container');

        // Helper: Tampilkan Notifikasi (Toast)
        function showToast(message, isError = false) {
            const toastContainer = document.getElementById('toast-container');
            const toastText = document.getElementById('toast-text');
            const toastMsgBox = document.getElementById('toast-message');
            
            toastText.textContent = message;
            
            if(isError) {
                toastMsgBox.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                toastMsgBox.classList.replace('bg-red-600', 'bg-gray-800');
            }

            toastContainer.classList.remove('hidden');
            setTimeout(() => {
                toastContainer.classList.add('hidden');
            }, 3500);
        }

        // Helper: Format Waktu (MM:SS)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Helper: Mulai Timer
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                state.timeLeft--;
                const timerDisplay = document.getElementById('timer-display');
                
                if (timerDisplay) {
                    timerDisplay.textContent = formatTime(state.timeLeft);
                    if (state.timeLeft <= 300) { // 5 menit terakhir
                        timerDisplay.classList.remove('text-green-800');
                        timerDisplay.classList.add('text-red-600', 'animate-pulse');
                    }
                }

                if (state.timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showToast("⏱️ Waktu Habis! Jawaban diproses otomatis.", true);
                    calculateAndSubmit();
                }
            }, 1000);
        }

        // Inisialisasi Aplikasi (dengan Fallback Aman)
        async function initApp() {
            try {
                // Pengecekan aman terhadap __firebase_config
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try {
                        firebaseConfig = JSON.parse(__firebase_config);
                    } catch (e) {
                        console.warn("Format config Firebase tidak valid. Menggunakan Mode Offline.");
                    }
                }

                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                } else {
                    // Fallback Offline agar aplikasi tidak blank
                    isOfflineMode = true;
                    console.log("Menjalankan aplikasi dalam Mode Lokal (Tanpa Database)");
                }
            } catch (error) {
                console.error("Firebase Init Error:", error);
                isOfflineMode = true;
            } finally {
                // Pastikan DOM siap sebelum mengganti layar
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    renderIntro();
                }, 500); // Sedikit delay untuk kelancaran animasi
            }
        }

        // Render Layar 1: Identitas
        function renderIntro() {
            mainContent.innerHTML = `
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-green-800 mb-2">Selamat Datang!</h2>
                    <p class="text-gray-600 text-sm sm:text-base">Silakan isi identitas diri Anda dengan benar sebelum memulai evaluasi.</p>
                </div>
                
                <form id="intro-form" class="space-y-5 max-w-md mx-auto">
                    <div>
                        <label for="student-name" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="student-name" required placeholder="Contoh: Budi Santoso" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition shadow-sm">
                    </div>
                    
                    <div>
                        <label for="student-class" class="block text-sm font-semibold text-gray-700 mb-1">Pilih Kelas</label>
                        <div class="relative">
                            <select id="student-class" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white appearance-none cursor-pointer shadow-sm">
                                <option value="" disabled selected>Pilih kelas Anda...</option>
                                <option value="X-A">Kelas X-A Agribisnis</option>
                                <option value="X-B">Kelas X-B Agribisnis</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transition duration-200 transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                            Mulai Kuis Waktu <span>⏱️</span>
                        </button>
                    </div>
                    
                    <div class="text-center mt-4">
                        <button type="button" id="btn-view-leaderboard" class="text-green-700 hover:text-green-800 font-semibold text-sm transition duration-200 flex items-center justify-center gap-1 mx-auto">
                            <span>🏆</span> Lihat Papan Peringkat
                        </button>
                    </div>
                </form>
            `;

            document.getElementById('intro-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('student-name').value.trim();
                const studentClass = document.getElementById('student-class').value;
                
                if (name.length < 3) {
                    showToast("Nama harus minimal 3 karakter.", true);
                    return;
                }

                state.studentName = name;
                state.studentClass = studentClass;
                state.currentQuestionIndex = 0;
                state.score = 0;
                state.answers.fill(null);
                state.timeLeft = 50 * 60; // 50 menit
                
                startTimer();
                renderQuiz();
            });

            document.getElementById('btn-view-leaderboard').addEventListener('click', renderLeaderboard);
        }

        // Render Layar 2: Kuis
        function renderQuiz() {
            const q = fullQuestions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex) / fullQuestions.length) * 100;
            const isLast = state.currentQuestionIndex === fullQuestions.length - 1;
            const currentSelected = state.answers[state.currentQuestionIndex];
            const timerColorClass = state.timeLeft <= 300 ? 'text-red-600 animate-pulse' : 'text-green-800';

            mainContent.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-5 bg-green-50 p-4 rounded-xl border border-green-200 shadow-sm">
                    <div class="text-sm font-semibold text-green-800 flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-green-100">
                        <span class="text-xl">⏱️</span> 
                        <span>Sisa Waktu:</span>
                        <span id="timer-display" class="text-lg font-bold ${timerColorClass} w-14 text-center">${formatTime(state.timeLeft)}</span>
                    </div>
                    <div class="text-xs sm:text-sm text-gray-600 font-medium font-mono bg-white px-3 py-1.5 rounded-lg border border-gray-200 w-full sm:w-auto text-center sm:text-right">
                        👤 ${state.studentName} <span class="text-green-500 font-bold mx-1">|</span> ${state.studentClass}
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-sm font-bold text-green-700 uppercase tracking-wider">Soal ${state.currentQuestionIndex + 1} / ${fullQuestions.length}</span>
                        <span class="text-xs text-gray-500 font-medium">${Math.round(progress)}% Selesai</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div class="bg-gradient-to-r from-green-500 to-green-600 h-full rounded-full transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm mb-6 min-h-[140px] flex items-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                    <p class="text-lg sm:text-xl text-gray-800 w-full leading-relaxed">${q.q}</p>
                </div>

                <div class="space-y-3" id="options-container">
                    ${q.o.map((opt, index) => `
                        <button class="option-btn w-full text-left p-4 border-2 ${currentSelected === index ? 'border-green-600 bg-green-600 text-white shadow-md' : 'border-gray-200 bg-white text-gray-700 hover:bg-green-50'} rounded-xl focus:outline-none flex items-center gap-4 group" data-index="${index}">
                            <span class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full border-2 ${currentSelected === index ? 'border-white' : 'border-gray-300 group-hover:border-green-400 group-hover:text-green-600'} text-base font-bold transition-colors">
                                ${optionLabels[index]}
                            </span>
                            <span class="flex-grow text-base sm:text-lg">${opt}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="mt-8 flex justify-between items-center border-t border-gray-100 pt-6">
                    <button id="btn-prev" class="text-gray-500 hover:text-green-700 font-semibold py-2 px-4 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1" ${state.currentQuestionIndex === 0 ? 'disabled' : ''}>
                        <span>&larr;</span> Sebelumnya
                    </button>
                    <button id="btn-next" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl shadow-md disabled:opacity-50 disabled:cursor-not-allowed transition transform hover:-translate-y-0.5" disabled>
                        ${isLast ? 'Kirim Jawaban ✓' : 'Selanjutnya &rarr;'}
                    </button>
                </div>
            `;

            const optionBtns = document.querySelectorAll('.option-btn');
            const nextBtn = document.getElementById('btn-next');
            const prevBtn = document.getElementById('btn-prev');

            if (currentSelected !== null) nextBtn.disabled = false;

            optionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    optionBtns.forEach(b => {
                        b.classList.remove('bg-green-600', 'text-white', 'border-green-600', 'shadow-md');
                        b.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
                        b.querySelector('span').classList.remove('border-white');
                        b.querySelector('span').classList.add('border-gray-300');
                    });
                    
                    this.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                    this.classList.add('bg-green-600', 'text-white', 'border-green-600', 'shadow-md');
                    this.querySelector('span').classList.remove('border-gray-300', 'group-hover:border-green-400', 'group-hover:text-green-600');
                    this.querySelector('span').classList.add('border-white');
                    
                    state.answers[state.currentQuestionIndex] = parseInt(this.getAttribute('data-index'));
                    nextBtn.disabled = false;
                });
            });

            nextBtn.addEventListener('click', () => {
                if (isLast) {
                    calculateAndSubmit();
                } else {
                    state.currentQuestionIndex++;
                    renderQuiz();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (state.currentQuestionIndex > 0) {
                    state.currentQuestionIndex--;
                    renderQuiz();
                }
            });
        }

        // Kalkulasi & Simpan Database
        async function calculateAndSubmit() {
            clearInterval(timerInterval);

            // Hitung skor (4 poin/soal)
            state.score = 0;
            state.answers.forEach((ans, idx) => {
                if (ans === fullQuestions[idx].a) state.score += 4;
            });

            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-green-600 mb-6"></div>
                    <h3 class="text-xl font-bold text-green-800">Memproses Jawaban...</h3>
                    <p class="text-sm text-gray-500 mt-2">Mohon tunggu sistem sedang merekam nilai Anda.</p>
                </div>
            `;

            if (isOfflineMode || !currentUser || !db) {
                setTimeout(() => {
                    showToast("Mode Offline: Nilai tidak disimpan ke server.", true);
                    renderResult();
                }, 1000);
                return;
            }

            try {
                const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(leaderboardRef, {
                    userId: currentUser.uid,
                    name: state.studentName,
                    className: state.studentClass,
                    score: state.score,
                    timestamp: serverTimestamp()
                });
                renderResult();
            } catch (error) {
                console.error("Gagal simpan:", error);
                showToast("Terjadi kendala jaringan. Nilai tetap ditampilkan.", true);
                renderResult();
            }
        }

        // Render Layar 3: Hasil
        function renderResult() {
            let message = ""; let emoji = "";
            
            if (state.score >= 85) { message = "Luar Biasa! Pemahamanmu sangat baik."; emoji = "🏆"; }
            else if (state.score >= 70) { message = "Kerja Bagus! Tingkatkan terus prestasimu."; emoji = "🌟"; }
            else if (state.score >= 50) { message = "Cukup baik, tapi masih perlu perbanyak latihan."; emoji = "👍"; }
            else { message = "Jangan menyerah! Pelajari lagi konsep pangkat & akar."; emoji = "📚"; }

            mainContent.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-flex items-center justify-center w-28 h-28 rounded-full bg-green-100 text-6xl mb-6 shadow-inner border-4 border-white">
                        ${emoji}
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Evaluasi Selesai!</h2>
                    <p class="text-gray-600 mb-8 text-lg">Terima kasih, <strong class="text-green-700">${state.studentName}</strong> (${state.studentClass})</p>
                    
                    <div class="bg-white rounded-3xl border border-green-100 p-8 max-w-sm mx-auto shadow-lg mb-8 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-green-500"></div>
                        <p class="text-sm text-gray-500 uppercase tracking-widest font-bold mb-2">Nilai Akhir</p>
                        <div class="text-7xl font-black text-green-600 mb-4 drop-shadow-sm">${state.score}</div>
                        <p class="text-sm text-green-800 font-medium px-4">${message}</p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center max-w-md mx-auto">
                        <button id="btn-to-leaderboard" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                            🏆 Lihat Peringkat
                        </button>
                        <button id="btn-restart" class="flex-1 bg-white hover:bg-gray-50 text-green-700 border-2 border-green-200 font-bold py-3.5 px-6 rounded-xl shadow-sm transition transform hover:-translate-y-0.5">
                            🔄 Main Lagi
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('btn-to-leaderboard').addEventListener('click', renderLeaderboard);
            document.getElementById('btn-restart').addEventListener('click', renderIntro);
        }

        // Render Layar 4: Leaderboard
        function renderLeaderboard() {
            mainContent.innerHTML = `
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                    <h2 class="text-2xl font-bold text-green-800 flex items-center gap-2">
                        <span>🏆</span> Papan Peringkat
                    </h2>
                    <button id="btn-back-from-lb" class="text-sm text-gray-600 hover:text-green-700 font-bold bg-white border border-gray-200 px-4 py-2 rounded-lg shadow-sm transition">
                        &larr; Kembali
                    </button>
                </div>
                
                <div id="leaderboard-list" class="space-y-3 max-h-[450px] overflow-y-auto pr-2 custom-scrollbar">
                    <div class="flex justify-center items-center py-12">
                        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-green-600 mr-3"></div>
                        <span class="text-gray-500 font-medium">Memuat data dari server...</span>
                    </div>
                </div>
            `;

            const backBtn = document.getElementById('btn-back-from-lb');
            backBtn.addEventListener('click', renderIntro);

            const listContainer = document.getElementById('leaderboard-list');

            if (isOfflineMode || !db) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 bg-yellow-50 rounded-xl border border-yellow-200">
                        <span class="text-3xl block mb-2">🔌</span>
                        <p class="text-yellow-800 font-semibold">Mode Offline Aktif</p>
                        <p class="text-yellow-600 text-sm mt-1">Papan peringkat tidak tersedia tanpa koneksi database.</p>
                        ${state.score > 0 ? `<div class="mt-4 inline-block bg-white px-4 py-2 rounded-lg border border-yellow-300 font-bold text-gray-700">Skor Terakhir Anda: <span class="text-green-600">${state.score}</span></div>` : ''}
                    </div>`;
                return;
            }

            const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            const unsubscribe = onSnapshot(leaderboardRef, (snapshot) => {
                let data = [];
                snapshot.forEach(doc => {
                    data.push({ id: doc.id, ...doc.data() });
                });

                data.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return timeA - timeB; 
                });

                const topData = data.slice(0, 50);
                
                if(!document.getElementById('leaderboard-list')) return;

                if (topData.length === 0) {
                    listContainer.innerHTML = `<div class="text-center py-12 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">Belum ada skor yang tersimpan. Jadilah yang pertama!</div>`;
                    return;
                }

                listContainer.innerHTML = topData.map((item, index) => {
                    let rankBadge = `<span class="w-10 h-10 flex items-center justify-center font-bold text-gray-500 bg-gray-100 rounded-full">${index + 1}</span>`;
                    if (index === 0) rankBadge = `<span class="w-10 h-10 flex items-center justify-center text-2xl bg-yellow-100 rounded-full" title="Peringkat 1">🥇</span>`;
                    if (index === 1) rankBadge = `<span class="w-10 h-10 flex items-center justify-center text-2xl bg-gray-200 rounded-full" title="Peringkat 2">🥈</span>`;
                    if (index === 2) rankBadge = `<span class="w-10 h-10 flex items-center justify-center text-2xl bg-orange-100 rounded-full" title="Peringkat 3">🥉</span>`;

                    const isMe = (item.name === state.studentName && item.className === state.studentClass);
                    const bgClass = isMe ? 'bg-green-50 border-green-400 shadow-md' : 'bg-white border-gray-100 hover:border-green-200';

                    return `
                        <div class="flex items-center justify-between p-4 border-2 rounded-xl ${bgClass} transition">
                            <div class="flex items-center gap-4">
                                ${rankBadge}
                                <div>
                                    <div class="font-bold text-gray-800 ${isMe ? 'text-green-700' : ''} text-lg">${item.name} ${isMe ? '<span class="text-xs ml-1 bg-green-200 text-green-800 px-2 py-0.5 rounded-full">Anda</span>' : ''}</div>
                                    <div class="text-xs font-semibold text-gray-500 bg-gray-100 inline-block px-2 py-1 rounded mt-1">Kelas ${item.className}</div>
                                </div>
                            </div>
                            <div class="font-black text-2xl text-green-600 px-2">
                                ${item.score}
                            </div>
                        </div>
                    `;
                }).join('');

            }, (error) => {
                console.error("LB Error:", error);
                if(listContainer) {
                    listContainer.innerHTML = `<div class="text-center py-6 text-red-500 text-sm font-medium bg-red-50 rounded-xl">Gagal memuat papan peringkat. Koneksi terputus.</div>`;
                }
            });
            
            backBtn.addEventListener('click', () => {
                unsubscribe();
            }, { once: true });
        }

        // Jalankan saat dokumen dimuat sepenuhnya
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
