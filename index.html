<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran Matematika Agribisnis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(22, 163, 74, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #4ade80;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .math {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.15em;
            font-style: italic;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #86efac; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex items-center justify-center p-4 sm:p-6">

    <!-- App Container -->
    <div id="app-container" class="glass-panel w-full max-w-4xl rounded-2xl overflow-hidden hidden flex-col">
        <header class="bg-gradient-to-r from-green-700 to-green-600 text-white p-5 text-center border-b-4 border-green-500">
            <h1 class="text-2xl sm:text-3xl font-bold flex items-center justify-center gap-2">
                <span>🌱</span> Matematika Agribisnis <span>🌾</span>
            </h1>
            <p class="text-green-100 font-medium mt-1">Bentuk Pangkat & Akar - Kelas X SMK</p>
        </header>

        <main class="p-5 sm:p-8 flex-grow relative min-h-[400px]" id="main-content">
            <!-- Content Injected via JS -->
        </main>
    </div>

    <!-- Loading Screen -->
    <div id="global-loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-green-600 mb-4"></div>
        <p class="text-green-800 font-bold text-lg animate-pulse" id="loading-text">Menghubungkan ke Server...</p>
    </div>

    <!-- Custom Modal / Toast for Alerts -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 hidden z-50 transition-opacity duration-300">
        <div id="toast-message" class="bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl font-medium text-sm flex items-center gap-2">
            <span id="toast-text">Pesan</span>
        </div>
    </div>

    <script type="module">
        // 1. IMPORT FIREBASE SDK (Strictly version 11.6.1 as required)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. GLOBAL VARIABLES & CONFIG
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sim-matematika-agri-v4';
        let app, db, auth, currentUser;
        
        const state = {
            studentName: '',
            studentClass: '',
            currentQuestionIndex: 0,
            score: 0,
            answers: new Array(25).fill(null),
            timeLeft: 50 * 60, // 50 menit
            timerInterval: null
        };

        // 3. BANK SOAL (25 Soal)
        const questions = [
            // 20 Soal Matematika Dasar
            { q: "Nilai dari <span class='math'>2<sup>5</sup></span> adalah...", o: ["10", "16", "32", "64", "128"], a: 2 },
            { q: "Bentuk sederhana dari <span class='math'>3<sup>2</sup> &times; 3<sup>4</sup></span> adalah...", o: ["<span class='math'>3<sup>6</sup></span>", "<span class='math'>3<sup>8</sup></span>", "<span class='math'>9<sup>6</sup></span>", "<span class='math'>9<sup>8</sup></span>", "<span class='math'>6<sup>6</sup></span>"], a: 0 },
            { q: "Bentuk sederhana dari <span class='math'>a<sup>7</sup> / a<sup>3</sup></span> adalah...", o: ["<span class='math'>a<sup>10</sup></span>", "<span class='math'>a<sup>4</sup></span>", "<span class='math'>a<sup>3</sup></span>", "<span class='math'>a<sup>21</sup></span>", "<span class='math'>a<sup>-4</sup></span>"], a: 1 },
            { q: "Hasil dari <span class='math'>(2<sup>3</sup>)<sup>2</sup></span> adalah...", o: ["<span class='math'>2<sup>5</sup></span>", "<span class='math'>2<sup>6</sup></span>", "<span class='math'>2<sup>9</sup></span>", "<span class='math'>4<sup>5</sup></span>", "<span class='math'>8<sup>3</sup></span>"], a: 1 },
            { q: "Nilai dari <span class='math'>5<sup>0</sup></span> adalah...", o: ["0", "1", "5", "-1", "Tak terdefinisi"], a: 1 },
            { q: "Hasil dari <span class='math'>2<sup>-3</sup></span> adalah...", o: ["-6", "-8", "1/6", "1/8", "8"], a: 3 },
            { q: "Bentuk akar dari <span class='math'>x<sup>1/2</sup></span> adalah...", o: ["<span class='math'>x<sup>2</sup></span>", "<span class='math'>2x</span>", "<span class='math'>&radic;x</span>", "<span class='math'><sup>3</sup>&radic;x</span>", "<span class='math'>x<sup>-2</sup></span>"], a: 2 },
            { q: "Hasil dari <span class='math'>&radic;144</span> adalah...", o: ["10", "12", "14", "16", "18"], a: 1 },
            { q: "Bentuk sederhana dari <span class='math'>&radic;50</span> adalah...", o: ["<span class='math'>5&radic;2</span>", "<span class='math'>2&radic;5</span>", "<span class='math'>25&radic;2</span>", "<span class='math'>5&radic;10</span>", "<span class='math'>10&radic;5</span>"], a: 0 },
            { q: "Hasil dari <span class='math'>3&radic;2 + 5&radic;2</span> adalah...", o: ["<span class='math'>8&radic;4</span>", "<span class='math'>15&radic;2</span>", "<span class='math'>8&radic;2</span>", "<span class='math'>15&radic;4</span>", "8"], a: 2 },
            { q: "Hasil dari <span class='math'>&radic;12 &times; &radic;3</span> adalah...", o: ["<span class='math'>&radic;15</span>", "<span class='math'>&radic;36</span>", "6", "9", "12"], a: 2 },
            { q: "Bentuk rasional dari <span class='math'>2 / &radic;3</span> adalah...", o: ["<span class='math'>(2&radic;3) / 3</span>", "<span class='math'>2&radic;3</span>", "<span class='math'>&radic;3 / 2</span>", "<span class='math'>(3&radic;3) / 2</span>", "<span class='math'>&radic;3</span>"], a: 0 },
            { q: "Nilai <span class='math'>x</span> yang memenuhi <span class='math'>2<sup>x</sup> = 16</span> adalah...", o: ["2", "3", "4", "5", "6"], a: 2 },
            { q: "Bentuk rasional dari <span class='math'>5 / (2 + &radic;3)</span> adalah...", o: ["<span class='math'>5(2 - &radic;3)</span>", "<span class='math'>10 - &radic;3</span>", "<span class='math'>5(2 + &radic;3)</span>", "<span class='math'>5</span>", "<span class='math'>-5(2 - &radic;3)</span>"], a: 0 },
            { q: "Hasil dari <span class='math'>(3a<sup>2</sup>)<sup>3</sup></span> adalah...", o: ["<span class='math'>3a<sup>6</sup></span>", "<span class='math'>9a<sup>6</sup></span>", "<span class='math'>27a<sup>5</sup></span>", "<span class='math'>27a<sup>6</sup></span>", "<span class='math'>9a<sup>5</sup></span>"], a: 3 },
            { q: "Jika <span class='math'>a = 4</span> dan <span class='math'>b = 9</span>, nilai <span class='math'>a<sup>1/2</sup> + b<sup>1/2</sup></span> adalah...", o: ["5", "7", "13", "36", "97"], a: 0 },
            { q: "Bentuk sederhana dari <span class='math'>&radic;72 / &radic;2</span> adalah...", o: ["4", "5", "6", "7", "8"], a: 2 },
            { q: "Hasil dari <span class='math'>2<sup>3</sup> &times; 2<sup>-1</sup></span> adalah...", o: ["1", "2", "4", "8", "16"], a: 2 },
            { q: "Hasil dari <span class='math'>(x<sup>2</sup>y<sup>3</sup>)<sup>4</sup></span> adalah...", o: ["<span class='math'>x<sup>6</sup>y<sup>7</sup></span>", "<span class='math'>x<sup>8</sup>y<sup>12</sup></span>", "<span class='math'>x<sup>8</sup>y<sup>7</sup></span>", "<span class='math'>x<sup>2</sup>y<sup>12</sup></span>", "<span class='math'>xy<sup>24</sup></span>"], a: 1 },
            { q: "Hasil perkalian <span class='math'>(2&radic;5)(3&radic;2)</span> adalah...", o: ["<span class='math'>5&radic;7</span>", "<span class='math'>6&radic;7</span>", "<span class='math'>5&radic;10</span>", "<span class='math'>6&radic;10</span>", "30"], a: 3 },
            // 5 Soal Cerita Agribisnis
            { q: "Sebuah lahan perkebunan kelapa sawit berbentuk persegi memiliki luas <span class='math'>10<sup>4</sup></span> m<sup>2</sup>. Jika di sekeliling lahan akan dipasang pagar, berapa meter panjang kawat yang dibutuhkan untuk satu putaran pagar?", o: ["100 m", "200 m", "400 m", "800 m", "1000 m"], a: 2 },
            { q: "Pertumbuhan populasi hama wereng pada lahan padi mengikuti rumus <span class='math'>N = 50 &times; 2<sup>t/2</sup></span>, dengan t dalam hari. Berapa jumlah populasi hama setelah 6 hari?", o: ["100 ekor", "200 ekor", "300 ekor", "400 ekor", "500 ekor"], a: 3 },
            { q: "Volume tangki penyemprot pupuk cair berbentuk kubus adalah <span class='math'>27 &times; 10<sup>3</sup></span> cm<sup>3</sup>. Panjang sisi tangki tersebut adalah...", o: ["3 cm", "9 cm", "30 cm", "90 cm", "300 cm"], a: 2 },
            { q: "Sebuah bibit pohon mangga mengalami pertambahan tinggi <span class='math'>&radic;3</span> cm setiap minggu. Jika diamati selama <span class='math'>&radic;12</span> minggu, pertambahan tinggi totalnya adalah...", o: ["3 cm", "4 cm", "6 cm", "9 cm", "12 cm"], a: 2 },
            { q: "Hasil panen padi (dalam kuintal) dirumuskan dengan <span class='math'>P(t) = 10 &times; &radic;t</span>, di mana t adalah waktu tanam dalam bulan. Jika panen ideal dicapai setelah 16 bulan pengamatan, hasil panennya adalah...", o: ["20 kuintal", "30 kuintal", "40 kuintal", "160 kuintal", "256 kuintal"], a: 2 }
        ];
        const optionLabels = ['A', 'B', 'C', 'D', 'E'];

        // 4. HELPER FUNCTIONS
        const dom = {
            main: document.getElementById('main-content'),
            loading: document.getElementById('global-loading'),
            app: document.getElementById('app-container'),
            toast: document.getElementById('toast-container'),
            toastMsg: document.getElementById('toast-message'),
            toastText: document.getElementById('toast-text')
        };

        function showToast(message, isError = false) {
            dom.toastText.innerHTML = message;
            dom.toastMsg.className = `px-6 py-3 rounded-xl shadow-2xl font-medium text-sm flex items-center gap-2 text-white ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
            dom.toast.classList.remove('hidden');
            setTimeout(() => dom.toast.classList.add('hidden'), 3500);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                const timerDisplay = document.getElementById('timer-display');
                if (timerDisplay) {
                    timerDisplay.textContent = formatTime(state.timeLeft);
                    if (state.timeLeft <= 300) {
                        timerDisplay.classList.replace('text-green-800', 'text-red-600');
                        timerDisplay.classList.add('animate-pulse');
                    }
                }
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    showToast("Waktu Habis! Mengumpulkan jawaban otomatis...", true);
                    submitQuiz();
                }
            }, 1000);
        }

        // 5. FIREBASE INITIALIZATION
        async function initFirebase() {
            try {
                let config = null;
                if (typeof __firebase_config !== 'undefined') {
                    config = JSON.parse(__firebase_config);
                }

                if (!config) {
                    throw new Error("Konfigurasi Firebase tidak ditemukan.");
                }

                app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);

                // RULE 3: AUTH SEBELUM QUERY
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                console.log("Firebase Terhubung. User ID:", currentUser.uid);
                
                setTimeout(() => {
                    dom.loading.classList.add('hidden');
                    dom.app.classList.remove('hidden');
                    dom.app.classList.add('flex');
                    renderLogin();
                }, 500);

            } catch (error) {
                console.error("Firebase Init Error:", error);
                document.getElementById('loading-text').textContent = "Aplikasi berjalan dalam mode lokal (Tanpa Cloud)";
                setTimeout(() => {
                    dom.loading.classList.add('hidden');
                    dom.app.classList.remove('hidden');
                    dom.app.classList.add('flex');
                    renderLogin();
                }, 1500);
            }
        }

        // 6. RENDER VIEWS
        function renderLogin() {
            dom.main.innerHTML = `
                <div class="animate-fade-in max-w-md mx-auto mt-4">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-green-800">Isi Data Diri</h2>
                        <p class="text-gray-600 mt-1">Lengkapi identitas untuk merekam hasil di Leaderboard.</p>
                    </div>
                    <form id="login-form" class="space-y-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="input-name" required placeholder="Contoh: Budi Petani" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                            <select id="input-class" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none bg-white cursor-pointer">
                                <option value="" disabled selected>-- Pilih Kelas --</option>
                                <option value="X-A">Kelas X-A</option>
                                <option value="X-B">Kelas X-B</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-md transition transform hover:-translate-y-0.5 mt-2">
                            Mulai Kerjakan Soal
                        </button>
                    </form>
                    <div class="text-center mt-6">
                        <button id="btn-show-lb" class="text-green-700 font-semibold hover:underline">🏆 Lihat Papan Peringkat</button>
                    </div>
                </div>
            `;

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('input-name').value.trim();
                const cls = document.getElementById('input-class').value;
                if(name.length < 3) return showToast("Nama minimal 3 karakter", true);
                
                // Reset State
                state.studentName = name;
                state.studentClass = cls;
                state.currentQuestionIndex = 0;
                state.answers.fill(null);
                state.timeLeft = 50 * 60; // Reset ke 50 menit
                
                startTimer();
                renderQuiz();
            });
            document.getElementById('btn-show-lb').addEventListener('click', renderLeaderboard);
        }

        function renderQuiz() {
            const qIndex = state.currentQuestionIndex;
            const q = questions[qIndex];
            const progress = ((qIndex) / questions.length) * 100;
            const selected = state.answers[qIndex];

            dom.main.innerHTML = `
                <div class="animate-fade-in flex flex-col h-full">
                    <!-- Info Bar -->
                    <div class="flex flex-wrap justify-between items-center gap-3 mb-5 bg-white p-3 rounded-xl border border-green-100 shadow-sm">
                        <div class="flex items-center gap-2 bg-green-50 px-3 py-1.5 rounded-lg">
                            <span>⏱️</span>
                            <span id="timer-display" class="font-bold text-green-800 text-lg w-14 text-center">${formatTime(state.timeLeft)}</span>
                        </div>
                        <div class="text-sm font-medium text-gray-700 bg-gray-50 px-3 py-1.5 rounded-lg">
                            👤 ${state.studentName} | ${state.studentClass}
                        </div>
                    </div>

                    <!-- Progress -->
                    <div class="mb-5">
                        <div class="flex justify-between text-xs font-bold text-green-700 mb-1">
                            <span>SOAL ${qIndex + 1} DARI ${questions.length}</span>
                            <span>${Math.round(progress)}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-green-500 h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-white p-5 sm:p-6 rounded-2xl border border-gray-100 shadow-sm mb-5 relative">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-green-500 rounded-l-2xl"></div>
                        <p class="text-lg text-gray-800 ml-2">${q.q}</p>
                    </div>

                    <!-- Options -->
                    <div class="space-y-3 flex-grow">
                        ${q.o.map((opt, i) => `
                            <button class="option-btn w-full text-left p-4 border-2 rounded-xl flex items-center gap-4 ${selected === i ? 'border-green-600 bg-green-600 text-white shadow-md' : 'border-gray-200 bg-white text-gray-700 hover:bg-green-50'}" data-index="${i}">
                                <span class="w-8 h-8 flex items-center justify-center rounded-full border-2 font-bold ${selected === i ? 'border-white' : 'border-gray-300'}">${optionLabels[i]}</span>
                                <span>${opt}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Navigation -->
                    <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-100">
                        <button id="btn-prev" class="px-5 py-2.5 rounded-xl font-semibold text-gray-600 hover:bg-gray-100 disabled:opacity-30" ${qIndex === 0 ? 'disabled' : ''}>&larr; Kembali</button>
                        <button id="btn-next" class="px-8 py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-md disabled:opacity-50 transition" ${selected === null ? 'disabled' : ''}>
                            ${qIndex === questions.length - 1 ? 'Selesai & Kirim' : 'Selanjutnya &rarr;'}
                        </button>
                    </div>
                </div>
            `;

            // Attach Events
            const opts = document.querySelectorAll('.option-btn');
            const btnNext = document.getElementById('btn-next');
            
            opts.forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-index'));
                    state.answers[qIndex] = idx;
                    renderQuiz(); // Re-render for quick UI update
                });
            });

            btnNext.addEventListener('click', () => {
                if (qIndex === questions.length - 1) {
                    if (confirm("Apakah Anda yakin ingin mengirim semua jawaban? Waktu masih tersisa.")) {
                        submitQuiz();
                    }
                } else {
                    state.currentQuestionIndex++;
                    renderQuiz();
                }
            });

            document.getElementById('btn-prev').addEventListener('click', () => {
                if (qIndex > 0) {
                    state.currentQuestionIndex--;
                    renderQuiz();
                }
            });
        }

        async function submitQuiz() {
            clearInterval(state.timerInterval);
            
            // Calculate Score (25 soal, 1 soal = 4 poin = Max 100)
            state.score = 0;
            state.answers.forEach((ans, idx) => {
                if (ans === questions[idx].a) state.score += 4;
            });

            dom.main.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 text-center animate-fade-in">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-green-600 mb-4"></div>
                    <h3 class="text-xl font-bold text-gray-800">Menyimpan Hasil...</h3>
                </div>
            `;

            // RULE 1: STRICT PATH + RULE 3: AUTH GUARD
            if (currentUser && db) {
                try {
                    const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    await addDoc(leaderboardRef, {
                        userId: currentUser.uid,
                        name: state.studentName,
                        className: state.studentClass,
                        score: state.score,
                        timestamp: Date.now() // Menggunakan Date.now() untuk sorting offline/online konsisten
                    });
                } catch (error) {
                    console.error("Gagal menyimpan ke Firebase:", error);
                    showToast("Peringatan: Gagal menyimpan data online.", true);
                }
            } else {
                showToast("Mode Lokal: Data tidak tersimpan ke server.", true);
            }

            renderResult();
        }

        function renderResult() {
            let msg = "";
            if (state.score >= 80) msg = "Sangat Baik! Pertahankan prestasimu.";
            else if (state.score >= 60) msg = "Cukup Baik! Pelajari lagi agar lebih maksimal.";
            else msg = "Jangan menyerah! Ayo banyak berlatih soal pangkat dan akar.";

            dom.main.innerHTML = `
                <div class="animate-fade-in text-center py-8">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai</h2>
                    <p class="text-gray-600 mb-6">Atas nama <strong class="text-green-700">${state.studentName}</strong> (${state.studentClass})</p>
                    
                    <div class="bg-white rounded-3xl border border-green-100 p-8 max-w-sm mx-auto shadow-lg mb-8 relative">
                        <div class="absolute top-0 left-0 w-full h-2 bg-green-500 rounded-t-3xl"></div>
                        <p class="text-sm text-gray-500 font-bold mb-2 uppercase tracking-widest">Skor Akhir</p>
                        <div class="text-7xl font-black text-green-600 mb-4">${state.score}</div>
                        <p class="text-sm text-green-800 font-medium bg-green-50 py-2 rounded-lg">${msg}</p>
                    </div>

                    <div class="flex gap-4 justify-center">
                        <button id="btn-res-lb" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition">🏆 Leaderboard</button>
                        <button id="btn-res-home" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-xl transition">Beranda</button>
                    </div>
                </div>
            `;

            document.getElementById('btn-res-lb').addEventListener('click', renderLeaderboard);
            document.getElementById('btn-res-home').addEventListener('click', renderLogin);
        }

        function renderLeaderboard() {
            dom.main.innerHTML = `
                <div class="animate-fade-in flex flex-col h-full max-h-[500px]">
                    <div class="flex items-center justify-between mb-4 border-b pb-3">
                        <h2 class="text-xl sm:text-2xl font-bold text-green-800">🏆 Papan Peringkat</h2>
                        <button id="btn-back-lb" class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-bold transition">Tutup</button>
                    </div>
                    
                    <div id="lb-content" class="flex-grow overflow-y-auto custom-scrollbar pr-2 space-y-3">
                        <div class="text-center py-10 text-gray-500">Memuat data...</div>
                    </div>
                </div>
            `;

            document.getElementById('btn-back-lb').addEventListener('click', renderLogin);

            const lbContent = document.getElementById('lb-content');

            // GUARD AUTENTIKASI
            if (!currentUser || !db) {
                lbContent.innerHTML = `<div class="text-center py-8 bg-yellow-50 text-yellow-800 rounded-xl">⚠️ Offline Mode: Papan peringkat membutuhkan koneksi database aktif.</div>`;
                return;
            }

            // RULE 1: STRICT PATH
            const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            // Mengambil semua data lalu sort di Memory (RULE 2: NO COMPLEX QUERIES)
            const unsubscribe = onSnapshot(leaderboardRef, (snapshot) => {
                let data = [];
                snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));

                // Sorting di memory (Desc by score, Asc by time)
                data.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return (a.timestamp || 0) - (b.timestamp || 0);
                });

                // Ambil top 50
                const top50 = data.slice(0, 50);

                if (top50.length === 0) {
                    if(lbContent) lbContent.innerHTML = `<div class="text-center py-8 bg-gray-50 text-gray-500 rounded-xl">Belum ada skor yang tercatat.</div>`;
                    return;
                }

                if(lbContent) {
                    lbContent.innerHTML = top50.map((item, idx) => {
                        let rank = `<span class="w-8 h-8 flex justify-center items-center font-bold bg-gray-100 text-gray-600 rounded-full">${idx + 1}</span>`;
                        if (idx === 0) rank = `<span class="text-2xl">🥇</span>`;
                        if (idx === 1) rank = `<span class="text-2xl">🥈</span>`;
                        if (idx === 2) rank = `<span class="text-2xl">🥉</span>`;

                        const isMe = (item.name === state.studentName && item.className === state.studentClass);

                        return `
                            <div class="flex items-center justify-between p-3 border rounded-xl ${isMe ? 'bg-green-50 border-green-300' : 'bg-white border-gray-100'}">
                                <div class="flex items-center gap-3">
                                    ${rank}
                                    <div>
                                        <div class="font-bold ${isMe ? 'text-green-800' : 'text-gray-800'}">${item.name}</div>
                                        <div class="text-xs text-gray-500">Kelas ${item.className}</div>
                                    </div>
                                </div>
                                <div class="font-black text-xl text-green-600">${item.score}</div>
                            </div>
                        `;
                    }).join('');
                }
            }, (error) => {
                console.error("Leaderboard error:", error);
                if(lbContent) lbContent.innerHTML = `<div class="text-center py-8 bg-red-50 text-red-600 rounded-xl">Gagal memuat leaderboard.</div>`;
            });

            // Cleanup listener saat keluar
            document.getElementById('btn-back-lb').addEventListener('click', () => {
                unsubscribe();
            }, { once: true });
        }

        // 7. START APP
        document.addEventListener('DOMContentLoaded', initFirebase);

    </script>
</body>
</html>
