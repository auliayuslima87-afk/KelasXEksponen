       <div class="flex items-center gap-3"><span class="flex h-11 w-11 items-center justify-center rounded-xl bg-yellow-100 text-yellow-800"><i data-lucide="medal" class="w-5 h-5"></i></span>
        <div>
         <h2 id="leaderboard-heading" data-template-id="leaderboard-title" class="canva-text text-xl font-extrabold"></h2>
         <p data-template-id="leaderboard-subtitle" class="canva-text text-sm"></p>
        </div>
       </div>
       <div id="leaderboard-list" class="mt-5 space-y-3" aria-live="polite">
        <p id="leaderboard-loading" class="text-sm text-green-800">Memuat peringkat panen…</p>
       </div>
      </aside>
     </div>
    </section>
   </main>
   <div id="notice" class="fixed bottom-5 left-1/2 z-40 hidden w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-2xl bg-green-900 px-5 py-4 text-center font-semibold text-white shadow-2xl" role="status"></div>
  </div>
  <div id="profile-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
   <section data-template-id="profile-modal-card" class="canva-card w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl" aria-labelledby="profile-title">
    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-green-100 text-green-800">
     <i data-lucide="sprout" class="w-6 h-6"></i>
    </div>
    <p data-template-id="profile-eyebrow" class="canva-text mt-5 text-sm font-bold uppercase tracking-[.15em] text-green-700"></p>
    <h2 id="profile-title" data-template-id="profile-title-text" class="canva-text display-font mt-1 text-3xl"></h2>
    <p data-template-id="profile-desc" class="canva-text mt-3 leading-relaxed"></p>
    <form id="profile-form" class="mt-6 space-y-5">
     <div><label data-template-id="name-label" class="canva-text mb-2 block text-sm font-bold" for="student-name"></label> <input id="student-name" required type="text" autocomplete="name" class="w-full rounded-xl border border-green-200 bg-green-50 px-4 py-3 outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-200">
     </div>
     <fieldset><legend data-template-id="class-label" class="canva-text mb-2 block text-sm font-bold"></legend>
      <div class="grid gap-2"><label class="flex cursor-pointer items-center gap-3 rounded-xl border border-green-200 p-3 transition hover:bg-green-50"> <input type="radio" name="student-class" value="Kelas XI-ATP" required class="accent-green-700"> <span data-template-id="class-atp-text" class="canva-text font-semibold"></span> </label> <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-green-200 p-3 transition hover:bg-green-50"> <input type="radio" name="student-class" value="Kelas XI-ATPH" required class="accent-green-700"> <span data-template-id="class-atph-text" class="canva-text font-semibold"></span> </label>
      </div>
     </fieldset><button type="submit" data-template-id="profile-submit-button" class="canva-button w-full rounded-xl px-5 py-3 font-bold focus:outline-none focus:ring-2 focus:ring-yellow-500"></button>
    </form>
   </section>
  </div>
  <template id="question-template">
   <article data-template-id="question-card" class="canva-card rounded-2xl border border-green-100 bg-green-50 p-5">
    <p class="question-text text-lg font-bold leading-relaxed"></p>
    <div class="options-list mt-5 grid gap-3"></div>
   </article>
  </template>
  <script src="/_sdk/22383239e6d7279e.editing_sdk.js" integrity="sha512-qvtUeUgPbBuWkcjob5tx6AGU1PQHkx4zgZWqqpaXOQqF0FGg35lPkDg2Eh+f2u6Np/H74EENvDhGRPcQgwZA+Q=="></script>
  <script>
    const quizQuestions = [
      ["Jika g(x)=0,8x−2 dan f(x)=0,9x−1, maka (f∘g)(x) adalah …", ["0,72x−2,8","0,72x−1,8","1,7x−3","0,8x−2,9","0,9x−2"], 0, "Substitusi g(x) ke f: 0,9(0,8x−2)−1 = 0,72x−2,8."],
      ["Dari gabah 100 kg, g(x)=0,8x−2 lalu f(x)=0,9x−1. Hasil beras bersih adalah …", ["68,2 kg","69,2 kg","70 kg","71 kg","72 kg"], 0, "f(g(100))=0,9(78)−1=69,2 kg."],
      ["Jika f(x)=3x+15, invers f⁻¹(x) adalah …", ["(x−15)/3","3x−15","x/3+15","(x+15)/3","1/(3x+15)"], 0, "Tukar x dan y, lalu selesaikan x=(y−15)/3."],
      ["Untuk hasil jagung 45 ton dengan f(x)=3x+15, pupuk yang diperlukan adalah …", ["10 kg","15 kg","20 kg","30 kg","45 kg"], 0, "x=(45−15)/3=10."],
      ["Jika f(x)=2x+5 dan g(x)=x², maka (f∘g)(x) adalah …", ["2x²+5","(2x+5)²","x²+5","2x²+10x+5","x²+2"], 0, "Masukkan g(x)=x² ke f: 2(x²)+5."],
      ["Jika f(x)=4x−7, nilai f⁻¹(13) adalah …", ["5","3","20","−5","52"], 0, "x=(13+7)/4=5."],
      ["Komposisi (g∘f)(x) berarti …", ["g(f(x))","f(g(x))","g(x)×f(x)","g(x)+f(x)","f(x)/g(x)"], 0, "Fungsi f dikerjakan lebih dahulu, lalu hasilnya masuk ke g."],
      ["Jika f(x)=x+4 dan g(x)=2x, maka (g∘f)(3) adalah …", ["14","10","7","12","6"], 0, "g(f(3))=g(7)=14."],
      ["Syarat fungsi memiliki invers adalah fungsi tersebut …", ["satu-satu","konstan","kuadrat","periodik","selalu nol"], 0, "Fungsi satu-satu memasangkan setiap output dengan satu input."],
      ["Jika f(x)=5x, nilai f⁻¹(40) adalah …", ["8","200","35","45","5"], 0, "f⁻¹(x)=x/5, sehingga f⁻¹(40)=8."],
      ["Jika f(x)=x−6 dan g(x)=3x, maka (f∘g)(x) adalah …", ["3x−6","3x+6","x−18","3x","x−6"], 0, "f(g(x))=f(3x)=3x−6."],
      ["Fungsi h(x)=2x+1 digunakan setelah fungsi g(x)=x−3. Bentuk h∘g adalah …", ["2x−5","2x+4","x−5","2x−2","x−2"], 0, "h(x−3)=2(x−3)+1=2x−5."],
      ["Jika f(x)=7x−14, nilai f⁻¹(0) adalah …", ["2","−2","14","7","0"], 0, "0=7x−14, maka x=2."],
      ["Fungsi invers digunakan dalam pertanian untuk …", ["menghitung kembali input dari hasil","menambah dua hasil panen","menggambar grafik saja","menghilangkan variabel","mengubah kg menjadi meter"], 0, "Invers membantu mencari nilai awal ketika hasil akhir diketahui."],
      ["Jika g(x)=x+2 dan f(x)=x², maka (f∘g)(1) adalah …", ["9","3","1","4","6"], 0, "f(g(1))=f(3)=9."],
      ["Jika f(x)=10x+5, maka f⁻¹(x) adalah …", ["(x−5)/10","10x−5","x/10+5","(x+5)/10","1/(10x+5)"], 0, "Pindahkan 5, lalu bagi 10."],
      ["Untuk f(x)=2x−3, nilai f(f(4)) adalah …", ["7","5","2","8","11"], 0, "f(4)=5, kemudian f(5)=7."],
      ["Jika f(x)=x/2 dan g(x)=x+8, maka (f∘g)(x) adalah …", ["x/2+4","x/2+8","x+4","2x+4","x+16"], 0, "f(x+8)=(x+8)/2=x/2+4."],
      ["Jika hasil panen y=4x+8, banyak input x saat y=28 adalah …", ["5","7","9","20","112"], 0, "x=(28−8)/4=5."],
      ["Pernyataan yang benar tentang f∘g dan g∘f adalah …", ["tidak selalu sama","selalu sama","selalu nol","selalu invers","selalu kuadrat"], 0, "Urutan fungsi penting, sehingga komposisi tidak selalu komutatif."]
    ];

    const gameQuestions = [
      ["f(x)=2x+3. Nilai f(4)?", ["11","8","5"], 0],
      ["f(x)=3x+6. Nilai f⁻¹(21)?", ["5","7","9"], 0],
      ["g(x)=x−2, f(x)=2x. Nilai f(g(6))?", ["8","10","4"], 0],
      ["f(x)=5x. Nilai f⁻¹(35)?", ["7","5","30"], 0],
      ["g(x)=x+1, f(x)=x². Nilai f(g(2))?", ["9","4","6"], 0]
    ];

    let currentQuestion = 0, answers = Array(20).fill(null), quizSeconds = 1200, quizTimerId = null;
    let gameScore = 0, gameSeconds = 45, gameTimerId = null, gameIndex = 0;
    let backendRecords = [], initialLoadTimer, quizScore = 0;
    const profileModal = document.getElementById("profile-modal");

    function showNotice(message, isError = false) {
      const notice = document.getElementById("notice");
      notice.textContent = message;
      notice.className = "fixed bottom-5 left-1/2 z-40 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-2xl px-5 py-4 text-center font-semibold text-white shadow-2xl " + (isError ? "bg-red-700" : "bg-green-900");
      setTimeout(() => notice.classList.add("hidden"), 3600);
    }

    function setView(viewId) {
      document.querySelectorAll(".view").forEach(view => view.classList.toggle("active", view.id === viewId));
      if (viewId === "quiz" && !quizTimerId && !document.getElementById("quiz-result").classList.contains("hidden")) return;
      if (viewId === "quiz" && !quizTimerId && document.getElementById("quiz-result").classList.contains("hidden")) startQuizTimer();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateWelcome() {
      const profile = JSON.parse(localStorage.getItem("mpiProfile") || "null");
      document.getElementById("welcome-text").textContent = profile ? `Halo, ${profile.name} (${profile.className})` : "Halo, Petani Muda!";
    }

    function openProfile() {
      const profile = JSON.parse(localStorage.getItem("mpiProfile") || "null");
      if (profile) {
        document.getElementById("student-name").value = profile.name;
        const option = document.querySelector(`input[value="${profile.className}"]`);
        if (option) option.checked = true;
      }
      profileModal.classList.remove("hidden");
    }

    function formatTime(seconds) {
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function renderQuestion() {
      const [question, options] = quizQuestions[currentQuestion];
      const fragment = document.getElementById("question-template").content.cloneNode(true);
      fragment.querySelector(".question-text").textContent = question;
      const list = fragment.querySelector(".options-list");
      options.forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "question-option choice flex cursor-pointer items-center gap-3 rounded-xl border-2 border-green-100 bg-white p-4 transition";
        label.innerHTML = `<input class="h-4 w-4 accent-green-700" type="radio" name="answer" value="${index}" ${answers[currentQuestion] === index ? "checked" : ""}><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-green-100 text-sm font-extrabold text-green-800">${String.fromCharCode(65 + index)}</span><span class="font-semibold">${option}</span>`;
        if (answers[currentQuestion] === index) label.classList.add("selected");
        label.querySelector("input").addEventListener("change", () => {
          answers[currentQuestion] = index;
          list.querySelectorAll(".choice").forEach(item => item.classList.remove("selected"));
          label.classList.add("selected");
        });
        list.appendChild(label);
      });
      const area = document.getElementById("quiz-question-area");
      area.replaceChildren(fragment);
      document.getElementById("quiz-count").textContent = `Soal ${currentQuestion + 1} dari ${quizQuestions.length}`;
      document.getElementById("quiz-progress").style.width = `${((currentQuestion + 1) / quizQuestions.length) * 100}%`;
      document.getElementById("prev-question").disabled = currentQuestion === 0;
      document.getElementById("prev-question").style.opacity = currentQuestion === 0 ? ".45" : "1";
      document.getElementById("next-question").textContent = currentQuestion === quizQuestions.length - 1 ? "Selesai & Lihat Nilai" : "Soal Berikutnya";
    }

    function startQuizTimer() {
      clearInterval(quizTimerId);
      document.getElementById("quiz-timer").textContent = formatTime(quizSeconds);
      quizTimerId = setInterval(() => {
        quizSeconds--;
        document.getElementById("quiz-timer").textContent = formatTime(Math.max(0, quizSeconds));
        if (quizSeconds <= 0) finishQuiz();
      }, 1000);
    }

    async function finishQuiz() {
      clearInterval(quizTimerId); quizTimerId = null;
      quizScore = answers.reduce((score, answer, index) => score + (answer === quizQuestions[index][2] ? 5 : 0), 0);
      document.getElementById("quiz-form").classList.add("hidden");
      document.getElementById("quiz-result").classList.remove("hidden");
      document.getElementById("quiz-score-display").textContent = `Nilai Latihan: ${quizScore} / 100`;
      document.getElementById("quiz-summary").textContent = `Kamu menjawab benar ${quizScore / 5} dari 20 soal. Pelajari kembali pembahasan untuk menguatkan konsep.`;
      const review = document.getElementById("answer-review");
      review.replaceChildren();
      quizQuestions.forEach((item, index) => {
        const correct = answers[index] === item[2];
        const row = document.createElement("div");
        row.className = `rounded-xl border p-3 text-sm ${correct ? "border-green-200 bg-white" : "border-red-200 bg-red-50"}`;
        row.innerHTML = `<p class="font-extrabold">${index + 1}. ${correct ? "Benar" : "Perlu ditinjau"}</p><p class="mt-1">${item[3]}</p>`;
        review.appendChild(row);
      });
      await saveProgress("Latihan berhasil dicatat ke papan peringkat.");
    }

    async function saveProgress(successMessage) {
      const profile = JSON.parse(localStorage.getItem("mpiProfile") || "null");
      if (!profile || !window.dataSdk) return;
      if (backendRecords.length >= 999) {
        showNotice("Batas data peringkat telah tercapai.", true);
        return;
      }
      const record = {
        nama: profile.name,
        kelas: profile.className,
        skor_latihan: quizScore,
        skor_game: gameScore,
        total_skor: quizScore + gameScore,
        waktu_pengerjaan: new Date().toISOString()
      };
      const result = await window.dataSdk.create(record);
      if (!result.isOk) showNotice("Skor tersimpan, tetapi belum dapat dikonfirmasi. Coba muat ulang.", true);
      else showNotice(successMessage);
    }

    function resetQuiz() {
      clearInterval(quizTimerId);
      currentQuestion = 0; answers = Array(20).fill(null); quizSeconds = 1200; quizScore = 0;
      document.getElementById("quiz-result").classList.add("hidden");
      document.getElementById("quiz-form").classList.remove("hidden");
      renderQuestion(); startQuizTimer();
    }

    function renderGameQuestion() {
      const [question, options] = gameQuestions[gameIndex % gameQuestions.length];
      document.getElementById("game-instruction").textContent = question;
      const optionsBox = document.getElementById("game-options");
      optionsBox.replaceChildren();
      options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "rounded-xl border-2 border-white bg-white/70 px-4 py-3 text-left font-bold transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-yellow-300";
        button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
        button.addEventListener("click", () => {
          if (!gameTimerId) return;
          if (index === gameQuestions[gameIndex % gameQuestions.length][2]) {
            gameScore += 10;
            document.getElementById("game-score").textContent = gameScore;
            showNotice("+10 poin panen!");
          }
          gameIndex++;
          renderGameQuestion();
        });
        optionsBox.appendChild(button);
      });
    }

    function startGame() {
      clearInterval(gameTimerId);
      gameScore = 0; gameSeconds = 45; gameIndex = 0;
      document.getElementById("game-score").textContent = "0";
      document.getElementById("game-timer").textContent = "45";
      renderGameQuestion();
      gameTimerId = setInterval(async () => {
        gameSeconds--;
        document.getElementById("game-timer").textContent = gameSeconds;
        if (gameSeconds <= 0) {
          clearInterval(gameTimerId); gameTimerId = null;
          document.getElementById("game-instruction").textContent = `Panen selesai! Kamu memperoleh ${gameScore} poin.`;
          document.getElementById("game-options").replaceChildren();
          await saveProgress("Skor Panen Presisi berhasil dicatat.");
        }
      }, 1000);
    }

    function renderLeaderboard() {
      const list = document.getElementById("leaderboard-list");
      list.replaceChildren();
      const sorted = [...backendRecords].sort((a, b) => (b.total_skor || 0) - (a.total_skor || 0)).slice(0, 8);
      if (!sorted.length) {
        const empty = document.createElement("p");
        empty.className = "rounded-xl bg-green-50 p-4 text-sm text-green-800";
        empty.textContent = "Belum ada skor tersimpan. Jadilah petani presisi pertama!";
        list.appendChild(empty);
        return;
      }
      sorted.forEach((record, index) => {
        const item = document.createElement("div");
        item.className = "flex items-center gap-3 rounded-2xl bg-green-50 p-3";
        item.innerHTML = `<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full ${index < 3 ? "bg-yellow-300 text-yellow-950" : "bg-white text-green-800"} font-extrabold">${index + 1}</span><div class="min-w-0 flex-1"><p class="truncate font-extrabold">${record.nama || "Siswa"}</p><p class="text-xs text-green-700">${record.kelas || ""} · Latihan ${record.skor_latihan || 0} + Game ${record.skor_game || 0}</p></div><strong class="text-green-800">${record.total_skor || 0}</strong>`;
        list.appendChild(item);
      });
    }

    const handler = {
      onDataChanged(data) {
        clearTimeout(initialLoadTimer);
        backendRecords = data;
        renderLeaderboard();
      }
    };

    async function initializeDataSdk() {
      initialLoadTimer = setTimeout(() => {
        document.getElementById("leaderboard-list").innerHTML = '<p class="rounded-xl bg-red-50 p-4 text-sm text-red-700">Peringkat belum dapat dimuat. Coba buka kembali modul ini.</p>';
      }, 8000);
      const initResult = await window.dataSdk.init(handler);
      if (!initResult.isOk) {
        clearTimeout(initialLoadTimer);
        document.getElementById("leaderboard-list").innerHTML = '<p class="rounded-xl bg-red-50 p-4 text-sm text-red-700">Peringkat belum dapat dihubungkan saat ini.</p>';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      updateWelcome();
      renderQuestion();
      if (localStorage.getItem("mpiProfile")) profileModal.classList.add("hidden");

      document.querySelectorAll(".nav-button, .dashboard-link").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
      document.getElementById("edit-profile").addEventListener("click", openProfile);
      document.querySelectorAll(".explain-button").forEach(button => button.addEventListener("click", () => document.getElementById(button.dataset.target).classList.toggle("open")));

      document.getElementById("profile-form").addEventListener("submit", event => {
        event.preventDefault();
        const name = document.getElementById("student-name").value.trim();
        const className = document.querySelector('input[name="student-class"]:checked').value;
        localStorage.setItem("mpiProfile", JSON.stringify({ name, className }));
        profileModal.classList.add("hidden");
        updateWelcome();
        showNotice("Profil belajar siap. Selamat belajar!");
      });

      document.getElementById("prev-question").addEventListener("click", () => { if (currentQuestion > 0) { currentQuestion--; renderQuestion(); } });
      document.getElementById("next-question").addEventListener("click", () => {
        if (currentQuestion === quizQuestions.length - 1) finishQuiz();
        else { currentQuestion++; renderQuestion(); }
      });
      document.getElementById("restart-quiz").addEventListener("click", resetQuiz);
      document.getElementById("start-game").addEventListener("click", startGame);
      initializeDataSdk();
    });
  </script>
 </body>
